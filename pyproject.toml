[project]
name = "nasm-pyfmt"
version = "0.1.0"
description = "Opinionated formatter for NASM assembly source code"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Daniel de Matos Alves", email = "dmalves.programmer@outlook.com" },
]
dependencies = []

[project.scripts]
nasm-pyfmt = "nasm_pyfmt.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
